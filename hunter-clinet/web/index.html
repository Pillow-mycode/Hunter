<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunter - 自动化渗透测试系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-title">
                    <img src="hunter.png" alt="Hunter" class="logo-icon">
                    <h1>Hunter</h1>
                </div>
                <p>自动化渗透测试系统</p>
            </div>
            <button class="new-chat-btn" onclick="newChat()">
                <span>+</span> 新建会话
            </button>
            <div class="task-list" id="taskList">
                <!-- 会话历史列表 -->
            </div>
            <div class="sidebar-footer">
                <button class="settings-btn" id="settingsBtn" onclick="openSettings()" title="设置">⚙</button>
                <div class="server-status" id="serverStatus">
                    <span class="status-dot offline"></span>
                    <span class="status-text">未连接</span>

                </div>


            </div>
        </aside>

        <!-- 主聊天区域 -->
        <main class="chat-container">
            <div class="chat-header">
                <h2 id="chatTitle">Hunter 渗透测试助手</h2>
                <span class="task-id" id="currentTaskId"></span>
                <div class="export-dropdown">
                    <button class="export-btn" id="exportBtn" title="导出会话">导出</button>
                    <div class="export-menu">
                        <button onclick="exportSession('markdown')">Markdown</button>
                        <button onclick="exportSession('text')">纯文本</button>
                    </div>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <div class="welcome-icon"><img src="hunter.png" alt="Hunter" class="welcome-logo"></div>
                    <h2>欢迎使用 Hunter</h2>
                    <p>我是自动化渗透测试助手，可以帮你执行各种安全测试任务。</p>


                </div>
                <div class="agent-panels-grid" id="agentPanelsGrid"></div>
            </div>

            <div class="chat-input-container">
                <div class="input-wrapper">
                    <textarea
                        id="messageInput"
                        placeholder="输入渗透测试需求，例如：对 example.com 进行端口扫描"
                        rows="1"
                        onkeydown="handleKeyDown(event)"
                    ></textarea>
                    <button class="send-btn" onclick="sendMessage()" id="sendBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2L15 22L11 13M11 13L2 9L22 2"/>
                        </svg>
                    </button>
                    <button class="stop-btn" onclick="stopTask()" id="stopBtn" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <rect x="6" y="6" width="12" height="12" rx="2"/>
                        </svg>
                    </button>
                </div>
                <p class="input-hint">按 Enter 发送，Shift + Enter 换行</p>
            </div>
        </main>
    </div>

    <!-- 设置面板模态框（默认配置） -->
    <div class="modal-overlay hidden" id="settingsModal">
        <div class="modal-container" id="settingsModalContainer">
            <div class="modal-header">
                <h2 id="settingsModalTitle">设置</h2>
                <button class="modal-close" onclick="closeSettings()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-tab-content" id="settingsTabContent">
                </div>
            </div>
            <div class="modal-footer">
                <span class="test-result" id="testResult"></span>
                <div class="modal-footer-buttons">
                    <button class="btn-test" id="btnTest" onclick="testConnection()">测试连接</button>
                    <button class="btn-save" id="btnSave" onclick="saveConfig()">保存</button>
                    <button class="btn-advanced" id="btnAdvanced" onclick="openAdvancedSettings()">高级配置</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 高级配置模态框（4 个 Agent 详细配置） -->
    <div class="modal-overlay hidden" id="advancedSettingsModal">
        <div class="modal-container" id="advancedSettingsModalContainer">
            <div class="modal-header">
                <h2 id="advancedSettingsModalTitle">高级配置</h2>
                <button class="modal-close" onclick="closeAdvancedSettings()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="settings-tabs" id="advancedSettingsTabs">
                    <button class="settings-tab active" data-tab="leader">渗透专家</button>
                    <button class="settings-tab" data-tab="attacker">武器大师</button>
                    <button class="settings-tab" data-tab="hawkeye">鹰眼</button>
                    <button class="settings-tab" data-tab="analyst">数据分析员</button>
                </div>
                <div class="settings-tab-content" id="advancedSettingsTabContent">
                </div>
            </div>
            <div class="modal-footer">
                <span class="test-result" id="advancedTestResult"></span>
                <div class="modal-footer-buttons">
                    <button class="btn-test" id="advancedBtnTest" onclick="testConnection()">测试连接</button>
                    <button class="btn-save" id="advancedBtnSave" onclick="saveConfig()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
